# gitleaks 設定 (plugins-grok)
#
# 既定ルールセット (API キー / トークン / 秘密鍵) に加えて、公開マーケットプレイスに
# 出してはいけない「環境や所属が分かる情報」を検出する。
#
# 設計方針: 固有名詞 (会社ドメイン・案件名・ユーザー名) を**このファイルに書かない**。
# 書いた瞬間に設定ファイル自身が漏洩源になるため、ルールは汎用パターンで表現し、
# allowlist には「公開して問題ない例示値」だけを列挙する。
#
# 注意: gitleaks の正規表現は Go の RE2。否定先読み (?!...) は使えないので、
# 除外は必ず allowlist で行う。

[extend]
useDefault = true

# git 管理外のローカル生成物。`gitleaks git --staged` では元々対象外だが、
# `gitleaks dir .` で手動スキャンしたときにノイズになるため除外する。
[allowlist]
description = "スキャン対象外 (git 管理外のローカル設定)"
paths = [
  '''\.idea/''',
  '''\.DS_Store''',
]

# ---------------------------------------------------------------------------
# ローカル環境の絶対パス。OS のユーザー名と、ローカルのディレクトリ構成が漏れる。
# ドキュメントに書くときは ~/ か <placeholder>/ を使うこと。
# ---------------------------------------------------------------------------
[[rules]]
id = "local-absolute-home-path"
description = "ローカルのホームディレクトリ絶対パス (OS ユーザー名が漏れる)"
# 先頭の / を意図的に含めない。gitleaks の既定 allowlist が "/home/..." 形式を
# 誤検知として除外するため、先頭 / を含めると /home/ 配下が丸ごと素通りする
# (検証済み: 先頭 / を外すと検出される)。/Users/ 側は両方の書き方で検出できる。
regex = '''(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_.-]*/'''
tags = ["privacy", "path"]

  [rules.allowlist]
  description = "ドキュメント中の例示パス"
  regexes = [
    '''(?:Users|home)/(?:you|user|username|example)/''',
    '''(?:Users|home)/<[^>]+>/''',
  ]

# ---------------------------------------------------------------------------
# メールアドレス。所属組織が特定される。plugin.json の author は name のみにする。
# ---------------------------------------------------------------------------
[[rules]]
id = "email-address"
description = "メールアドレス (所属組織が特定される)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
tags = ["privacy", "email"]

  [rules.allowlist]
  description = "公開して問題ない既知のアドレスと、メールではない @ 表記"
  regexes = [
    '''noreply@x\.ai''',
    '''noreply@anthropic\.com''',
    '''[A-Za-z0-9._%+-]+@example\.(?:com|org|net)''',
    '''git@github\.com''',
  ]
