# コミット前に秘匿情報・環境情報を検出する。
#
# 有効化 (clone 後に 1 回だけ必要。git hook はリポジトリに含まれないため):
#   brew install pre-commit gitleaks jq
#   pre-commit install
#
# 検出されたときは --no-verify で握り潰さず、必ず内容を直すこと。
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (detect secrets and local paths)
        # --staged: ステージされた差分のみ走査 / --redact: 検出値をログに出さない
        entry: gitleaks git --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
      - id: check-versions
        name: check-versions (plugin.json と marketplace.json の version 一致)
        # 対象ファイルの有無 (削除・移動を含む) の判定と、ステージ内容での検査はラッパー側で行う。
        # files: は削除を拾わないので使わず always_run にしている。ファイル名は
        # --all-files 時の判定に使う (require_serial: 分割起動されても並走させない)
        entry: bash scripts/pre-commit-check-versions.sh
        language: system
        always_run: true
        require_serial: true
